name: Build PulseHabit Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Upgrade Jelly UI, 3D Icon & Build APK
        run: |
          if [ -z "$(find . -name 'settings.gradle.kts' -print -quit)" ]; then
            ZIP_FILE=$(find . -name '*.zip' -print -quit)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi
          PROJECT_FILE=$(find . -name 'settings.gradle.kts' -print -quit)
          cd "$(dirname "$PROJECT_FILE")"

          echo "android.useAndroidX=true" > gradle.properties

          python3 - << 'PYEOF'
          import base64, math, pathlib, struct, zlib

          APP_NAME = "脉冲习惯"

          HTML_B64 = """
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              
              4uCF8ibSw/LCXF/0H/OcKP7vNIeLtAcahQ6JDxdcw/p3Ly73ulzGLpeHd4lzihWFcatML8WW+Xd6JRnfQ0+es5VLuHNSXmW3c1K8tmmy7iw1Fib+P2bU/8A=
          """
          assets_dir = pathlib.Path("app/src/main/assets")
          assets_dir.mkdir(parents=True, exist_ok=True)
          (assets_dir / "index.html").write_bytes(zlib.decompress(base64.b64decode(HTML_B64)))

          def make_jelly_icon(size, mode="squircle"):
              pixels = bytearray(size * size * 4)
              cx, cy = (size - 1) / 2.0, (size - 1) / 2.0
              scale = 0.70 if mode == "foreground" else 1.0
              badge_r = size * 0.36 * scale
              stroke_w = size * 0.068 * scale

              def smoothstep(e0, e1, x):
                  t = max(0.0, min(1.0, (x - e0) / (e1 - e0)))
                  return t * t * (3.0 - 2.0 * t)

              def dist_seg(px, py, x1, y1, x2, y2):
                  vx, vy = x2 - x1, y2 - y1
                  wx, wy = px - x1, py - y1
                  c1 = vx * wx + vy * wy
                  if c1 <= 0:
                      return math.hypot(px - x1, py - y1)
                  c2 = vx * vx + vy * vy
                  if c2 <= c1:
                      return math.hypot(px - x2, py - y2)
                  b_val = c1 / c2
                  return math.hypot(px - (x1 + b_val * vx), py - (y1 + b_val * vy))

              for y in range(size):
                  ny = y / float(size)
                  for x in range(size):
                      nx = x / float(size)
                      dx, dy = x - cx, y - cy
                      dist = math.hypot(dx, dy)

                      if mode == "foreground":
                          r, g, b, base_a = 0.0, 0.0, 0.0, 0.0
                      else:
                          if mode == "background":
                              mask_a = 1.0
                              edge_d = max(abs(dx), abs(dy)) / (size * 0.5)
                          elif mode == "round":
                              mask_a = 1.0 - smoothstep(size*0.46 - 1.2, size*0.46 + 0.8, dist)
                              edge_d = dist / (size * 0.46)
                          else:
                              rx, ry = abs(dx) / (size * 0.445), abs(dy) / (size * 0.445)
                              sq = (rx**3.6 + ry**3.6) ** (1.0 / 3.6)
                              mask_a = 1.0 - smoothstep(0.98, 1.015, sq)
                              edge_d = sq
                          if mask_a <= 0.0:
                              continue

                          t = nx * 0.45 + ny * 0.55
                          r = 99 * (1 - t) + 56 * t
                          g = 102 * (1 - t) + 189 * t
                          b = 241 * (1 - t) + 248 * t

                          hx, hy = (nx - 0.34), (ny - 0.24)
                          gloss = max(0.0, 1.0 - math.hypot(hx * 0.85, hy * 1.25) / 0.38) ** 2.2
                          r += 110 * gloss
                          g += 110 * gloss
                          b += 95 * gloss

                          bevel = smoothstep(0.82, 1.0, edge_d)
                          r *= (1.0 - 0.28 * bevel)
                          g *= (1.0 - 0.28 * bevel)
                          b *= (1.0 - 0.22 * bevel)
                          base_a = mask_a

                      if mode != "background":
                          sd_dist = math.hypot(dx, dy - size * 0.035 * scale)
                          sh_a = (1.0 - smoothstep(badge_r * 0.85, badge_r * 1.18, sd_dist)) * 0.35
                          if sh_a > 0 and mode != "foreground":
                              r *= (1.0 - sh_a)
                              g *= (1.0 - sh_a)
                              b *= (1.0 - sh_a)

                          orb_a = 1.0 - smoothstep(badge_r - 1.2, badge_r + 1.0, dist)
                          if orb_a > 0:
                              ox, oy = dx / badge_r, dy / badge_r
                              oz = math.sqrt(max(0.0, 1.0 - ox*ox - oy*oy))
                              or_c = 16 * (1 - ny) + 6 * ny
                              og_c = 215 * (1 - ny) + 182 * ny
                              ob_c = 150 * (1 - ny) + 212 * ny
                              light = max(0.0, -0.38 * ox - 0.48 * oy + 0.79 * oz)
                              spec = (light ** 7.0) * 0.65
                              rim_dark = (1.0 - oz) ** 1.8 * 0.28
                              or_c = or_c * (1.0 - rim_dark) + 255 * spec
                              og_c = og_c * (1.0 - rim_dark) + 255 * spec
                              ob_c = ob_c * (1.0 - rim_dark) + 255 * spec
                              if mode == "foreground":
                                  r, g, b, base_a = or_c, og_c, ob_c, orb_a
                              else:
                                  r = r * (1 - orb_a) + or_c * orb_a
                                  g = g * (1 - orb_a) + og_c * orb_a
                                  b = b * (1 - orb_a) + ob_c * orb_a

                          p1x, p1y = cx - size * 0.125 * scale, cy + size * 0.015 * scale
                          p2x, p2y = cx - size * 0.02 * scale, cy + size * 0.12 * scale
                          p3x, p3y = cx + size * 0.145 * scale, cy - size * 0.095 * scale

                          ds_check = min(dist_seg(x, y - size*0.02*scale, p1x, p1y, p2x, p2y),
                                         dist_seg(x, y - size*0.02*scale, p2x, p2y, p3x, p3y))
                          chk_sh = (1.0 - smoothstep(stroke_w - 0.5, stroke_w + 3.5, ds_check)) * 0.25
                          if chk_sh > 0 and base_a > 0:
                              r *= (1.0 - chk_sh)
                              g *= (1.0 - chk_sh)
                              b *= (1.0 - chk_sh)

                          d_check = min(dist_seg(x, y, p1x, p1y, p2x, p2y), dist_seg(x, y, p2x, p2y, p3x, p3y))
                          check_a = 1.0 - smoothstep(stroke_w - 1.2, stroke_w + 1.0, d_check)
                          if check_a > 0:
                              tube_z = math.sqrt(max(0.0, 1.0 - (min(1.0, d_check / stroke_w)) ** 2))
                              cr, cg, cb = 242 + 13 * tube_z, 248 + 7 * tube_z, 255
                              r = r * (1 - check_a) + cr * check_a
                              g = g * (1 - check_a) + cg * check_a
                              b = b * (1 - check_a) + cb * check_a
                              if mode == "foreground":
                                  base_a = max(base_a, check_a)

                          sx, sy = cx + size * 0.22 * scale, cy - size * 0.22 * scale
                          star_r = math.hypot(x - sx, y - sy)
                          if star_r < size * 0.08 * scale:
                              ax_d = min(abs(x - sx), abs(y - sy))
                              star_a = max(0.0, 1.0 - ax_d / (size * 0.018 * scale)) * max(0.0, 1.0 - star_r / (size * 0.075 * scale))
                              if star_a > 0:
                                  r = r * (1 - star_a) + 255 * star_a
                                  g = g * (1 - star_a) + 245 * star_a
                                  b = b * (1 - star_a) + 150 * star_a
                                  if mode == "foreground":
                                      base_a = max(base_a, star_a)

                      idx = (y * size + x) * 4
                      pixels[idx] = min(255, max(0, int(r)))
                      pixels[idx+1] = min(255, max(0, int(g)))
                      pixels[idx+2] = min(255, max(0, int(b)))
                      pixels[idx+3] = min(255, max(0, int(base_a * 255)))

              raw = bytearray()
              for y in range(size):
                  raw.append(0)
                  raw.extend(pixels[y*size*4:(y+1)*size*4])

              def chunk(ct, d):
                  return struct.pack(">I", len(d)) + ct + d + struct.pack(">I", zlib.crc32(ct + d) & 0xffffffff)

              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          res = pathlib.Path("app/src/main/res")
          densities = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, px in densities.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              (d / "ic_launcher.png").write_bytes(make_jelly_icon(px, "squircle"))
              (d / "ic_launcher_round.png").write_bytes(make_jelly_icon(px, "round"))
              (d / "ic_launcher_bg.png").write_bytes(make_jelly_icon(int(px * 1.5), "background"))
              (d / "ic_launcher_fg.png").write_bytes(make_jelly_icon(int(px * 1.5), "foreground"))

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@mipmap/ic_launcher_bg" />\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_fg" />\n'
              '</adaptive-icon>\n'
          )
          (anydpi / "ic_launcher.xml").write_text(adaptive_xml, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(adaptive_xml, encoding="utf-8")

          vals = res / "values"
          vals.mkdir(parents=True, exist_ok=True)
          (vals / "strings.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              f'    <string name="app_name">{APP_NAME}</string>\n'
              '</resources>\n',
              encoding="utf-8"
          )

          pathlib.Path("app/src/main/AndroidManifest.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <application\n'
              '        android:allowBackup="true"\n'
              '        android:icon="@mipmap/ic_launcher"\n'
              '        android:roundIcon="@mipmap/ic_launcher_round"\n'
              '        android:label="@string/app_name"\n'
              '        android:supportsRtl="true"\n'
              '        android:theme="@android:style/Theme.NoTitleBar">\n'
              '        <activity\n'
              '            android:name=".MainActivity"\n'
              '            android:label="@string/app_name"\n'
              '            android:configChanges="orientation|screenSize|keyboardHidden"\n'
              '            android:exported="true">\n'
              '            <intent-filter android:label="@string/app_name">\n'
              '                <action android:name="android.intent.action.MAIN" />\n'
              '                <category android:name="android.intent.category.LAUNCHER" />\n'
              '            </intent-filter>\n'
              '        </activity>\n'
              '    </application>\n'
              '</manifest>\n',
              encoding="utf-8"
          )

          java_dir = pathlib.Path("app/src/main/java/com/qqsui/pulsehabit")
          java_dir.mkdir(parents=True, exist_ok=True)
          (java_dir / "MainActivity.java").write_text(
              'package com.qqsui.pulsehabit;\n\n'
              'import android.annotation.SuppressLint;\n'
              'import android.app.Activity;\n'
              'import android.os.Bundle;\n'
              'import android.view.Window;\n'
              'import android.webkit.WebChromeClient;\n'
              'import android.webkit.WebSettings;\n'
              'import android.webkit.WebView;\n'
              'import android.webkit.WebViewClient;\n\n'
              'public class MainActivity extends Activity {\n'
              '    private WebView webView;\n\n'
              '    @SuppressLint("SetJavaScriptEnabled")\n'
              '    @Override\n'
              '    protected void onCreate(Bundle savedInstanceState) {\n'
              '        super.onCreate(savedInstanceState);\n'
              '        Window window = getWindow();\n'
              '        if (window != null) {\n'
              '            window.setStatusBarColor(0xFF0B0F19);\n'
              '            window.setNavigationBarColor(0xFF161F33);\n'
              '        }\n'
              '        webView = new WebView(this);\n'
              '        setContentView(webView);\n\n'
              '        WebSettings settings = webView.getSettings();\n'
              '        settings.setJavaScriptEnabled(true);\n'
              '        settings.setDomStorageEnabled(true);\n'
              '        settings.setDatabaseEnabled(true);\n'
              '        settings.setAllowFileAccess(true);\n'
              '        settings.setCacheMode(WebSettings.LOAD_DEFAULT);\n\n'
              '        webView.setWebViewClient(new WebViewClient());\n'
              '        webView.setWebChromeClient(new WebChromeClient());\n'
              '        webView.loadUrl("file:///android_asset/index.html");\n'
              '    }\n\n'
              '    @Override\n'
              '    public void onBackPressed() {\n'
              '        if (webView != null && webView.canGoBack()) {\n'
              '            webView.goBack();\n'
              '        } else {\n'
              '            super.onBackPressed();\n'
              '        }\n'
              '    }\n'
              '}\n',
              encoding="utf-8"
          )
          PYEOF

          gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseHabit-debug-apk
          path: "**/app-debug.apk"
