name: Build PulseHabit Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Upgrade Jelly UI, 3D Icon & Build APK
        run: |
          if [ -z "$(find . -name 'settings.gradle.kts' -print -quit)" ]; then
            ZIP_FILE=$(find . -name '*.zip' -print -quit)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi
          PROJECT_FILE=$(find . -name 'settings.gradle.kts' -print -quit)
          cd "$(dirname "$PROJECT_FILE")"

          echo "android.useAndroidX=true" > gradle.properties
          mkdir -p app/src/main/assets

          cat << 'HTMLEOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="zh-CN" data-theme="dark">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>脉冲习惯</title>
            <style>
              :root {
                --bg-primary: #0b0f19; --bg-card: #161f33; --bg-elevated: #1f2a44;
                --border-subtle: rgba(148, 163, 184, 0.15); --text-primary: #f8fafc;
                --text-secondary: #94a3b8; --accent-cyan: #38bdf8; --accent-indigo: #6366f1;
                --accent-emerald: #10b981; --accent-amber: #f59e0b; --accent-rose: #f43f5e;
                --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
              }
              html[data-theme="light"] {
                --bg-primary: #f0f4f8; --bg-card: #ffffff; --bg-elevated: #f1f5f9;
                --border-subtle: rgba(15, 23, 42, 0.1); --text-primary: #0f172a; --text-secondary: #475569;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
              body {
                background: var(--bg-primary); color: var(--text-primary);
                font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
                min-height: 100vh; padding-bottom: 88px; user-select: none; overflow-x: hidden;
                transition: background 0.3s, color 0.3s;
              }
              @keyframes jellyBounce {
                0% { transform: scale(1, 1); }
                25% { transform: scale(1.26, 0.78); }
                45% { transform: scale(0.84, 1.16); }
                65% { transform: scale(1.09, 0.93); }
                82% { transform: scale(0.97, 1.03); }
                100% { transform: scale(1, 1); }
              }
              @keyframes jellyPopIn {
                0% { opacity: 0; transform: scale(0.75) translateY(16px); }
                65% { opacity: 1; transform: scale(1.04) translateY(-2px); }
                100% { opacity: 1; transform: scale(1) translateY(0); }
              }
              .anim-jelly { animation: jellyBounce 0.52s ease forwards !important; }
              .app-shell { max-width: 680px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 13px; }
              .app-header {
                display: flex; justify-content: space-between; align-items: center;
                background: var(--bg-card); border: 1px solid var(--border-subtle);
                border-radius: 20px; padding: 12px 15px;
                box-shadow: 0 8px 22px -6px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.08);
              }
              .brand { display: flex; align-items: center; gap: 11px; }
              .brand-icon {
                width: 40px; height: 40px; border-radius: 13px;
                background: radial-gradient(circle at 30% 25%, #6ee7b7, #10b981 55%, #0284c7 100%);
                display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; font-weight: 900;
                box-shadow: 0 5px 14px rgba(16,185,129,0.4), inset 0 3px 4px rgba(255,255,255,0.55); cursor: pointer;
              }
              .brand h1 { font-size: 16px; font-weight: 800; }
              .brand p { font-size: 11.5px; color: var(--text-secondary); }
              .jelly-btn {
                height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border-subtle);
                background: var(--bg-elevated); color: var(--text-primary); font-size: 12.5px; font-weight: 700;
                display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer;
                transition: transform 0.28s var(--spring);
              }
              .jelly-btn:active { transform: scale(0.84); }
              .jelly-btn.primary {
                background: linear-gradient(135deg, #6366f1, #38bdf8); border: none; color: #fff;
                box-shadow: 0 4px 12px rgba(56,189,248,0.35), inset 0 2px 3px rgba(255,255,255,0.4);
              }
              .kpi-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
              .kpi-mini {
                background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px;
                padding: 11px 12px; display: flex; flex-direction: column; gap: 3px;
                transition: transform 0.28s var(--spring);
              }
              .kpi-mini:active { transform: scale(0.94); }
              .kpi-mini-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; }
              .kpi-mini-val { font-size: 20px; font-weight: 800; font-family: monospace; }
              .kpi-mini-sub { font-size: 10.5px; color: var(--accent-cyan); font-weight: 600; }
              .week-strip-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 12px; }
              .week-nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; font-size: 12.5px; font-weight: 700; }
              .day-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
              .day-pill {
                display: flex; flex-direction: column; align-items: center; padding: 7px 2px;
                border-radius: 12px; background: var(--bg-elevated); border: 1.5px solid transparent;
                cursor: pointer; gap: 2px; transition: transform 0.3s var(--spring), background 0.2s;
              }
              .day-pill:active { transform: scale(0.82); }
              .day-pill.is-today { border-color: rgba(56,189,248,0.5); }
              .day-pill.selected {
                background: linear-gradient(145deg, var(--accent-indigo), var(--accent-cyan)); color: #fff;
                transform: translateY(-2px) scale(1.04); box-shadow: 0 5px 12px rgba(56,189,248,0.35);
              }
              .day-pill .wname { font-size: 10px; opacity: 0.88; font-weight: 600; }
              .day-pill .dnum { font-size: 13px; font-weight: 800; font-family: monospace; }
              .day-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: #10b981; }
              .tab-view { display: none; flex-direction: column; gap: 11px; }
              .tab-view.active { display: flex; }
              .habit-card {
                background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px;
                padding: 14px; display: flex; flex-direction: column; gap: 10px;
                box-shadow: 0 8px 20px -8px rgba(0,0,0,0.32), inset 0 1px 1px rgba(255,255,255,0.06);
                animation: jellyPopIn 0.4s var(--spring) backwards;
              }
              .habit-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
              .habit-title-group { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
              .color-pill { width: 9px; height: 40px; border-radius: 99px; flex-shrink: 0; box-shadow: inset 0 2px 3px rgba(255,255,255,0.4); }
              .habit-title { font-size: 14.5px; font-weight: 800; word-break: break-word; }
              .habit-sub { font-size: 11.5px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 7px; margin-top: 3px; }
              .big-check-btn {
                min-width: 84px; height: 40px; padding: 0 12px; border-radius: 13px;
                border: 1.5px solid var(--border-subtle); background: var(--bg-elevated); color: var(--text-primary);
                font-weight: 800; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center;
                cursor: pointer; flex-shrink: 0; transition: transform 0.3s var(--spring), background 0.2s;
                box-shadow: inset 0 2px 3px rgba(255,255,255,0.08);
              }
              .big-check-btn:active { transform: scale(0.8); }
              .big-check-btn.done {
                color: #fff; border-color: transparent;
                box-shadow: 0 5px 14px rgba(16,185,129,0.35), inset 0 3px 4px rgba(255,255,255,0.45);
              }
              .card-progress-track { width: 100%; height: 6px; background: var(--bg-elevated); border-radius: 99px; overflow: hidden; }
              .card-progress-fill { height: 100%; border-radius: 99px; transition: width 0.5s var(--spring); }
              .habit-card-bottom {
                display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
                gap: 8px; padding-top: 8px; border-top: 1px solid var(--border-subtle);
              }
              .mini-week-dots { display: flex; gap: 4px; }
              .mini-day-btn {
                width: 27px; height: 27px; border-radius: 8px; border: 1px solid var(--border-subtle);
                background: var(--bg-elevated); color: var(--text-secondary); font-size: 10px; font-weight: 800;
                display: flex; align-items: center; justify-content: center; cursor: pointer;
                transition: transform 0.28s var(--spring);
              }
              .mini-day-btn:active { transform: scale(0.76); }
              .mini-day-btn.done { color: #fff; border-color: transparent; box-shadow: inset 0 2px 2px rgba(255,255,255,0.35); }
              .card-tools-right { display: flex; align-items: center; gap: 5px; }
              .step-circle {
                width: 27px; height: 27px; border-radius: 8px; border: 1px solid var(--border-subtle);
                background: var(--bg-elevated); color: var(--text-primary); font-weight: 800; cursor: pointer;
                transition: transform 0.25s var(--spring);
              }
              .step-circle:active { transform: scale(0.75); }
              .action-pill-btn {
                height: 27px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border-subtle);
                background: var(--bg-elevated); color: var(--text-secondary); font-size: 11px; font-weight: 700;
                cursor: pointer; transition: transform 0.25s var(--spring);
              }
              .action-pill-btn:active { transform: scale(0.82); }
              .action-pill-btn.del { color: var(--accent-rose); border-color: rgba(244,63,94,0.3); }
              .section-card {
                background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 15px;
                animation: jellyPopIn 0.4s var(--spring) backwards;
              }
              .section-card h2 { font-size: 14.5px; font-weight: 800; margin-bottom: 4px; }
              .section-card p { font-size: 11.5px; color: var(--text-secondary); margin-bottom: 10px; }
              .streak-item { margin-bottom: 11px; }
              .streak-row-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; font-weight: 700; }
              .streak-track { height: 9px; background: var(--bg-elevated); border-radius: 99px; position: relative; overflow: hidden; }
              .streak-fill { height: 100%; border-radius: 99px; transition: width 0.55s var(--spring); }
              .heatmap-28 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
              .heat-box {
                aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center;
                font-size: 11px; font-family: monospace; font-weight: 700; border: 1px solid var(--border-subtle);
                cursor: pointer; transition: transform 0.25s var(--spring);
              }
              .heat-box:active { transform: scale(0.8); }
              .bottom-nav {
                position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card);
                border-top: 1px solid var(--border-subtle); padding: 8px 12px; display: flex;
                justify-content: space-around; z-index: 900;
              }
              .nav-item {
                background: none; border: none; color: var(--text-secondary); display: flex;
                flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700;
                cursor: pointer; padding: 5px 14px; border-radius: 13px; transition: transform 0.3s var(--spring);
              }
              .nav-item:active { transform: scale(0.82); }
              .nav-item.active { color: var(--accent-cyan); background: rgba(56,189,248,0.14); transform: translateY(-2px); }
              .modal {
                position: fixed; inset: 0; background: rgba(2,6,23,0.72); display: none;
                align-items: center; justify-content: center; padding: 16px; z-index: 1000;
              }
              .modal.open { display: flex; }
              .modal-box {
                background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 22px;
                width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
                animation: jellyPopIn 0.35s var(--spring);
              }
              .form-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; display: block; }
              .input-field {
                width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border-subtle);
                background: var(--bg-elevated); color: var(--text-primary); font-size: 14px;
              }
              .swatch-row { display: flex; gap: 10px; margin-top: 4px; }
              .swatch-dot {
                width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent;
                transition: transform 0.25s var(--spring);
              }
              .swatch-dot.selected { transform: scale(1.2); border-color: #fff; }
              .toast-bar {
                position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%) translateY(20px) scale(0.9);
                background: var(--bg-elevated); border: 1px solid var(--accent-cyan); color: var(--text-primary);
                padding: 9px 15px; border-radius: 99px; font-size: 12.5px; font-weight: 700;
                display: flex; align-items: center; gap: 10px; opacity: 0; pointer-events: none;
                transition: all 0.32s var(--spring); z-index: 1100; white-space: nowrap;
              }
              .toast-bar.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }
              .undo-btn {
                background: var(--accent-cyan); color: #0b0f19; border: none; padding: 3px 9px;
                border-radius: 99px; font-size: 11.5px; font-weight: 800; cursor: pointer;
              }
              .burst-particle { position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 2000; }
            </style>
          </head>
          <body>
            <div class="app-shell">
              <header class="app-header">
                <div class="brand">
                  <div class="brand-icon" id="logoBounce">✓</div>
                  <div>
                    <h1>脉冲习惯 PulseHabit</h1>
                    <p id="selectedDateBanner">2026-10-14 · 周三</p>
                  </div>
                </div>
                <div style="display:flex;gap:7px;">
                  <button class="jelly-btn" id="themeBtn">🌗</button>
                  <button class="jelly-btn primary" id="addBtn">＋ 新增模块</button>
                </div>
              </header>

              <section class="kpi-strip">
                <div class="kpi-mini">
                  <span class="kpi-mini-label">当日达成率</span>
                  <span class="kpi-mini-val" id="mTodayRate">0%</span>
                  <span class="kpi-mini-sub" id="mTodaySub">0/0 项</span>
                </div>
                <div class="kpi-mini">
                  <span class="kpi-mini-label">本周累计打卡</span>
                  <span class="kpi-mini-val" id="mWeekCount">0</span>
                  <span class="kpi-mini-sub" id="mWeekSub">周目标 0%</span>
                </div>
                <div class="kpi-mini">
                  <span class="kpi-mini-label">最长连续打卡</span>
                  <span class="kpi-mini-val" id="mBestStreak" style="color:var(--accent-amber);">🔥 0天</span>
                  <span class="kpi-mini-sub" id="mBestHabit">-</span>
                </div>
              </section>

              <section class="week-strip-card">
                <div class="week-nav-top">
                  <button class="jelly-btn" style="height:28px;padding:0 9px;" id="mPrevWeek">◀ 上周</button>
                  <span id="mWeekLabel">2026-10-12 ~ 10-18</span>
                  <button class="jelly-btn" style="height:28px;padding:0 9px;" id="mNextWeek">下周 ▶</button>
                </div>
                <div class="day-strip" id="mDayStrip"></div>
              </section>

              <div class="tab-view active" id="tabCheckin">
                <div id="mHabitList" style="display:flex;flex-direction:column;gap:11px;"></div>
                <div class="section-card">
                  <h2>💡 当日复盘手记</h2>
                  <textarea id="mReflection" class="input-field" style="min-height:72px;margin-top:6px;" placeholder="记录今日习惯完成情况或心得..."></textarea>
                </div>
              </div>

              <div class="tab-view" id="tabCharts">
                <div class="section-card">
                  <h2>📊 本周每日打卡趋势图</h2>
                  <p>柱高与折线展示周一至周日每日达成率</p>
                  <div id="mTrendSvg" style="width:100%;height:190px;"></div>
                </div>
                <div class="section-card">
                  <h2>🔥 连续打卡天数排行 (当前 vs 最佳)</h2>
                  <p>实心条为当前连续天数，浅色底条为历史最高纪录</p>
                  <div id="mStreakList"></div>
                </div>
                <div class="section-card">
                  <h2>🟩 近 28 天打卡热力图</h2>
                  <p>点击任意日期方块可切换至对应日期</p>
                  <div class="heatmap-28" id="mHeatmap"></div>
                </div>
              </div>

              <div class="tab-view" id="tabManage">
                <div class="section-card">
                  <h2>⚙️ 打卡模块批量管理</h2>
                  <p>除了在首页每张卡片右下角点击「✎ 编辑」或「🗑 删除」，你也可以在这里批量操作：</p>
                  <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
                    <button class="jelly-btn primary" style="height:42px;width:100%;" id="mAddFromManage">＋ 新增自定义打卡模块</button>
                    <button class="jelly-btn" style="height:42px;width:100%;color:var(--accent-rose);" id="mClearAllBtn">🗑 一键清空所有现有模块（从零创建）</button>
                    <button class="jelly-btn" style="height:42px;width:100%;" id="mRestoreDefaultBtn">↺ 恢复初始示例打卡模块</button>
                  </div>
                </div>
              </div>
            </div>

            <nav class="bottom-nav">
              <button class="nav-item active" data-tab="tabCheckin"><span>☑️</span><span>每日打卡</span></button>
              <button class="nav-item" data-tab="tabCharts"><span>📈</span><span>连续图表</span></button>
              <button class="nav-item" id="mTodayJump"><span>🎯</span><span>回到今天</span></button>
              <button class="nav-item" data-tab="tabManage"><span>⚙️</span><span>模块管理</span></button>
            </nav>

            <div class="modal" id="mModal">
              <div class="modal-box">
                <h3 style="font-size:16px;font-weight:800;" id="mModalTitle">新增打卡模块</h3>
                <input type="hidden" id="mEditId" value="" />
                <div>
                  <span class="form-label">习惯/目标名称 *</span>
                  <input type="text" id="mName" class="input-field" placeholder="例如：晨跑 30 分钟 / 读书 1 章" />
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <div>
                    <span class="form-label">每日目标数值</span>
                    <input type="number" id="mTarget" class="input-field" value="1" min="1" />
                  </div>
                  <div>
                    <span class="form-label">单位 (次/分钟/篇)</span>
                    <input type="text" id="mUnit" class="input-field" value="次" />
                  </div>
                </div>
                <div>
                  <span class="form-label">每周目标天数 (1~7)</span>
                  <input type="number" id="mFreq" class="input-field" value="5" min="1" max="7" />
                </div>
                <div>
                  <span class="form-label">Q弹糖果主题色</span>
                  <div class="swatch-row" id="mSwatchRow">
                    <div class="swatch-dot selected" data-color="#10b981" style="background:#10b981;"></div>
                    <div class="swatch-dot" data-color="#38bdf8" style="background:#38bdf8;"></div>
                    <div class="swatch-dot" data-color="#6366f1" style="background:#6366f1;"></div>
                    <div class="swatch-dot" data-color="#a855f7" style="background:#a855f7;"></div>
                    <div class="swatch-dot" data-color="#f59e0b" style="background:#f59e0b;"></div>
                    <div class="swatch-dot" data-color="#f43f5e" style="background:#f43f5e;"></div>
                  </div>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
                  <button class="jelly-btn" id="mCancel">取消</button>
                  <button class="jelly-btn primary" id="mSave">保存模块</button>
                </div>
              </div>
            </div>

            <div class="toast-bar" id="toastBar">
              <span id="toastText">已操作</span>
              <button class="undo-btn" id="undoBtn" style="display:none;">撤销删除</button>
            </div>

            <script>
              const ANCHOR_TODAY = "2026-10-14";
              const STORAGE_KEY = "pulse_habit_dashboard_v2";
              const WNAMES = ["一", "二", "三", "四", "五", "六", "日"];

              function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
              function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
              function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); }
              function getMonday(s) { const d = parseDate(s); const day = d.getDay(); d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day)); return fmtDate(d); }

              function defaultState() {
                const habits = [
                  { id: "h1", name: "LLM 推理与代码实验", targetValue: 60, unit: "分钟", weeklyGoal: 6, color: "#38bdf8" },
                  { id: "h2", name: "光学传感文献精读", targetValue: 1, unit: "篇", weeklyGoal: 5, color: "#6366f1" },
