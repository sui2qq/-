name: Build PulseHabit Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Locate Project and Build Debug APK
        run: |
          if [ -z "$(find . -name 'settings.gradle.kts' -print -quit)" ]; then
            ZIP_FILE=$(find . -name '*.zip' -print -quit)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi
          PROJECT_FILE=$(find . -name 'settings.gradle.kts' -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "未找到工程文件，请确认已将 PulseHabit_Android_Project.zip 或解压后的文件上传至仓库"
            exit 1
          fi
          cd "$(dirname "$PROJECT_FILE")"
          gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseHabit-debug-apk
          path: "**/app-debug.apk"
