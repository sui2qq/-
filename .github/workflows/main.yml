name: Build PulseHabit Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate App Icon, Name & Build APK
        run: |
          if [ -z "$(find . -name 'settings.gradle.kts' -print -quit)" ]; then
            ZIP_FILE=$(find . -name '*.zip' -print -quit)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi
          PROJECT_FILE=$(find . -name 'settings.gradle.kts' -print -quit)
          cd "$(dirname "$PROJECT_FILE")"

          echo "android.useAndroidX=true" > gradle.properties

          python3 - << 'PYEOF'
          import math, pathlib, struct, zlib

          APP_NAME = "脉冲习惯"

          def make_png(size, mode="squircle"):
              pixels = bytearray(size * size * 4)
              cx, cy = (size - 1) / 2.0, (size - 1) / 2.0
              scale = 0.72 if mode == "foreground" else 1.0
              r_card = size * 0.46
              r_outer = size * 0.34 * scale
              r_inner = size * 0.255 * scale
              stroke_w = size * 0.052 * scale

              def dist_seg(px, py, x1, y1, x2, y2):
                  vx, vy = x2 - x1, y2 - y1
                  wx, wy = px - x1, py - y1
                  c1 = vx * wx + vy * wy
                  if c1 <= 0:
                      return math.hypot(px - x1, py - y1)
                  c2 = vx * vx + vy * vy
                  if c2 <= c1:
                      return math.hypot(px - x2, py - y2)
                  b_val = c1 / c2
                  return math.hypot(px - (x1 + b_val * vx), py - (y1 + b_val * vy))

              def smoothstep(e0, e1, x):
                  t = max(0.0, min(1.0, (x - e0) / (e1 - e0)))
                  return t * t * (3.0 - 2.0 * t)

              for y in range(size):
                  ny = y / float(size)
                  for x in range(size):
                      nx = x / float(size)
                      dx, dy = x - cx, y - cy
                      dist = math.hypot(dx, dy)

                      if mode == "foreground":
                          r, g, b, base_a = 0.0, 0.0, 0.0, 0.0
                          glow = max(0.0, 1.0 - dist / (size * 0.35))
                          if glow > 0:
                              r, g, b = 56.0, 189.0, 248.0
                              base_a = (glow ** 2.2) * 0.35
                      else:
                          if mode == "round":
                              mask_a = 1.0 - smoothstep(r_card - 1.2, r_card + 0.8, dist)
                          else:
                              rx, ry = abs(dx) / (size * 0.44), abs(dy) / (size * 0.44)
                              sq = (rx**4 + ry**4) ** 0.25
                              mask_a = 1.0 - smoothstep(0.985, 1.015, sq)
                          if mask_a <= 0.0:
                              continue
                          t = nx * 0.5 + ny * 0.5
                          r = 13 * (1 - t) + 30 * t
                          g = 19 * (1 - t) + 41 * t
                          b = 38 * (1 - t) + 89 * t
                          glow = max(0.0, 1.0 - dist / (size * 0.42))
                          r += 42 * (glow ** 1.8)
                          g += 105 * (glow ** 1.8)
                          b += 165 * (glow ** 1.8)
                          base_a = mask_a

                      ring_a = smoothstep(r_inner - 1.2, r_inner + 1.0, dist) * (1.0 - smoothstep(r_outer - 1.0, r_outer + 1.2, dist))
                      if ring_a > 0:
                          rr = 56 * (1 - ny) + 16 * ny
                          rg = 189 * (1 - ny) + 185 * ny
                          rb = 248 * (1 - ny) + 129 * ny
                          if mode == "foreground":
                              r, g, b = rr, rg, rb
                              base_a = max(base_a, ring_a)
                          else:
                              r = r * (1 - ring_a) + rr * ring_a
                              g = g * (1 - ring_a) + rg * ring_a
                              b = b * (1 - ring_a) + rb * ring_a

                      p1x = cx + (0.35 - 0.5) * size * scale
                      p1y = cy + (0.51 - 0.5) * size * scale
                      p2x = cx + (0.455 - 0.5) * size * scale
                      p2y = cy + (0.615 - 0.5) * size * scale
                      p3x = cx + (0.655 - 0.5) * size * scale
                      p3y = cy + (0.385 - 0.5) * size * scale

                      d_check = min(dist_seg(x, y, p1x, p1y, p2x, p2y), dist_seg(x, y, p2x, p2y, p3x, p3y))
                      check_a = 1.0 - smoothstep(stroke_w - 1.2, stroke_w + 1.0, d_check)
                      if check_a > 0:
                          if mode == "foreground":
                              r = r * (1 - check_a) + 255 * check_a
                              g = g * (1 - check_a) + 255 * check_a
                              b = b * (1 - check_a) + 255 * check_a
                              base_a = max(base_a, check_a)
                          else:
                              r = r * (1 - check_a) + 255 * check_a
                              g = g * (1 - check_a) + 255 * check_a
                              b = b * (1 - check_a) + 255 * check_a

                      idx = (y * size + x) * 4
                      pixels[idx] = min(255, max(0, int(r)))
                      pixels[idx+1] = min(255, max(0, int(g)))
                      pixels[idx+2] = min(255, max(0, int(b)))
                      pixels[idx+3] = min(255, max(0, int(base_a * 255)))

              raw = bytearray()
              for y in range(size):
                  raw.append(0)
                  raw.extend(pixels[y*size*4:(y+1)*size*4])

              def chunk(ct, d):
                  return struct.pack(">I", len(d)) + ct + d + struct.pack(">I", zlib.crc32(ct + d) & 0xffffffff)

              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          res = pathlib.Path("app/src/main/res")
          densities = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, px in densities.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              (d / "ic_launcher.png").write_bytes(make_png(px, "squircle"))
              (d / "ic_launcher_round.png").write_bytes(make_png(px, "round"))
              (d / "ic_launcher_fg.png").write_bytes(make_png(int(px * 1.5), "foreground"))

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_bg" />\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_fg" />\n'
              '</adaptive-icon>\n'
          )
          (anydpi / "ic_launcher.xml").write_text(adaptive_xml, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(adaptive_xml, encoding="utf-8")

          vals = res / "values"
          vals.mkdir(parents=True, exist_ok=True)
          strings_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              f'    <string name="app_name">{APP_NAME}</string>\n'
              '    <color name="ic_launcher_bg">#111827</color>\n'
              '</resources>\n'
          )
          (vals / "strings.xml").write_text(strings_xml, encoding="utf-8")

          manifest_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <application\n'
              '        android:allowBackup="true"\n'
              '        android:icon="@mipmap/ic_launcher"\n'
              '        android:roundIcon="@mipmap/ic_launcher_round"\n'
              '        android:label="@string/app_name"\n'
              '        android:supportsRtl="true"\n'
              '        android:theme="@android:style/Theme.NoTitleBar">\n'
              '        <activity\n'
              '            android:name=".MainActivity"\n'
              '            android:label="@string/app_name"\n'
              '            android:configChanges="orientation|screenSize|keyboardHidden"\n'
              '            android:exported="true">\n'
              '            <intent-filter android:label="@string/app_name">\n'
              '                <action android:name="android.intent.action.MAIN" />\n'
              '                <category android:name="android.intent.category.LAUNCHER" />\n'
              '            </intent-filter>\n'
              '        </activity>\n'
              '    </application>\n'
              '</manifest>\n'
          )
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text(manifest_xml, encoding="utf-8")

          java_code = (
              'package com.qqsui.pulsehabit;\n\n'
              'import android.annotation.SuppressLint;\n'
              'import android.app.Activity;\n'
              'import android.os.Bundle;\n'
              'import android.view.Window;\n'
              'import android.webkit.WebChromeClient;\n'
              'import android.webkit.WebSettings;\n'
              'import android.webkit.WebView;\n'
              'import android.webkit.WebViewClient;\n\n'
              'public class MainActivity extends Activity {\n'
              '    private WebView webView;\n\n'
              '    @SuppressLint("SetJavaScriptEnabled")\n'
              '    @Override\n'
              '    protected void onCreate(Bundle savedInstanceState) {\n'
              '        super.onCreate(savedInstanceState);\n'
              '        Window window = getWindow();\n'
              '        if (window != null) {\n'
              '            window.setStatusBarColor(0xFF0B0F19);\n'
              '            window.setNavigationBarColor(0xFF161F33);\n'
              '        }\n'
              '        webView = new WebView(this);\n'
              '        setContentView(webView);\n\n'
              '        WebSettings settings = webView.getSettings();\n'
              '        settings.setJavaScriptEnabled(true);\n'
              '        settings.setDomStorageEnabled(true);\n'
              '        settings.setDatabaseEnabled(true);\n'
              '        settings.setAllowFileAccess(true);\n'
              '        settings.setCacheMode(WebSettings.LOAD_DEFAULT);\n\n'
              '        webView.setWebViewClient(new WebViewClient());\n'
              '        webView.setWebChromeClient(new WebChromeClient());\n'
              '        webView.loadUrl("file:///android_asset/index.html");\n'
              '    }\n\n'
              '    @Override\n'
              '    public void onBackPressed() {\n'
              '        if (webView != null && webView.canGoBack()) {\n'
              '            webView.goBack();\n'
              '        } else {\n'
              '            super.onBackPressed();\n'
              '        }\n'
              '    }\n'
              '}\n'
          )
          pathlib.Path("app/src/main/java/com/qqsui/pulsehabit/MainActivity.java").write_text(java_code, encoding="utf-8")
          PYEOF

          gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseHabit-debug-apk
          path: "**/app-debug.apk"
